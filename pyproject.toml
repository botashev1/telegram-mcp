[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telegram-read-only-local"
dynamic = ["version"]
description = "Read-only MCP server for Telegram with a per-chat allowlist"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nikita Kondratev" }]
keywords = ["mcp", "telegram", "telethon", "claude", "read-only", "allowlist"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp==2.3.0",
    "telethon==1.45.0",
    "python-socks[asyncio]==2.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.5,<1"]

[project.scripts]
telegram-read-only = "telegram_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/nskondratev/telegram-mcp"
Repository = "https://github.com/nskondratev/telegram-mcp"
Issues = "https://github.com/nskondratev/telegram-mcp/issues"

[tool.hatch.version]
path = "src/telegram_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests", "deployment/macos"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
